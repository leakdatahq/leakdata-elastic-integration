---
description: Normalize the allowlisted LeakData ECS alert document.
processors:
  - rename:
      field: json.@timestamp
      target_field: '@timestamp'
      override: true
  - rename:
      field: json.ecs
      target_field: ecs
      override: true
  - rename:
      field: json.event
      target_field: event
      override: true
  - rename:
      field: json.message
      target_field: message
      override: true
  - rename:
      field: json.observer
      target_field: observer
      override: true
  - rename:
      field: json.rule
      target_field: rule
      override: true
  - append:
      field: tags
      copy_from: json.tags
      allow_duplicates: false
  - rename:
      field: json.leakdata
      target_field: leakdata
      override: true
  - remove:
      field: json
      ignore_missing: true
  - set:
      field: event.module
      value: leakdata
  - set:
      field: event.dataset
      value: leakdata.exposure
  - set:
      field: event.ingested
      value: '{{{_ingest.timestamp}}}'
on_failure:
  - set:
      field: error.message
      value: '{{{_ingest.on_failure_message}}}'
